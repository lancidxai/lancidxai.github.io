<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 목록 · My Todo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f7f4; color: #1a1a18; min-height: 100vh; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 60px; background: #ffffff;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
    }
    .logo { font-size: 17px; font-weight: 500; color: #1a1a18; text-decoration: none; }
    .logo span { color: #534AB7; }
    .back-link { font-size: 14px; color: #5f5e5a; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .back-link:hover { color: #1a1a18; }

    .container { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }

    .page-title { font-size: 22px; font-weight: 500; color: #1a1a18; margin-bottom: 4px; }
    .date-str { font-size: 14px; color: #888780; margin-bottom: 1.5rem; }

    .input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .input-row input {
      flex: 1; padding: 0 12px; height: 42px;
      border: 0.5px solid rgba(0,0,0,0.2); border-radius: 10px;
      background: #ffffff; color: #1a1a18; font-size: 15px;
      font-family: inherit; outline: none;
    }
    .input-row input:focus { border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,0.1); }
    select {
      height: 42px; padding: 0 10px;
      border: 0.5px solid rgba(0,0,0,0.2); border-radius: 10px;
      background: #ffffff; color: #1a1a18;
      font-size: 13px; cursor: pointer; font-family: inherit; outline: none;
    }
    .add-btn {
      height: 42px; padding: 0 18px;
      background: #534AB7; color: #ffffff;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    .add-btn:hover { background: #3C3489; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
    .stat { background: #ffffff; border: 0.5px solid rgba(0,0,0,0.08); border-radius: 10px; padding: 10px 14px; }
    .stat-label { font-size: 12px; color: #888780; margin-bottom: 2px; }
    .stat-value { font-size: 22px; font-weight: 500; color: #1a1a18; }

    .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-btn {
      height: 30px; padding: 0 14px;
      border: 0.5px solid rgba(0,0,0,0.15); border-radius: 999px;
      background: transparent; color: #888780;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .filter-btn:hover { background: #eeede8; }
    .filter-btn.active { background: #EEEDFE; border-color: #AFA9EC; color: #3C3489; }
    .clear-btn {
      margin-left: auto; font-size: 13px; color: #888780;
      background: transparent; border: none; cursor: pointer;
      padding: 4px 8px; border-radius: 8px; font-family: inherit;
    }
    .clear-btn:hover { color: #A32D2D; background: #FCEBEB; }

    .todo-list { display: flex; flex-direction: column; gap: 6px; }
    .todo-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: #ffffff;
      border: 0.5px solid rgba(0,0,0,0.08); border-radius: 10px;
    }
    .todo-item.done { opacity: 0.5; }
    .todo-item.done .todo-text { text-decoration: line-through; color: #888780; }

    .check-btn {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.2); background: transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .check-btn.checked { background: #534AB7; border-color: #534AB7; }
    .check-btn svg { width: 11px; height: 11px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .todo-text { flex: 1; font-size: 15px; color: #1a1a18; line-height: 1.4; word-break: break-all; }
    .priority-badge {
      font-size: 11px; font-weight: 500; padding: 3px 9px;
      border-radius: 999px; flex-shrink: 0;
    }
    .p-high { background: #FCEBEB; color: #791F1F; }
    .p-mid  { background: #FAEEDA; color: #633806; }
    .p-low  { background: #EAF3DE; color: #27500A; }

    .delete-btn {
      width: 28px; height: 28px; border: none; background: transparent;
      color: #b4b2a9; cursor: pointer; font-size: 14px;
      border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .delete-btn:hover { background: #FCEBEB; color: #A32D2D; }

    .empty { text-align: center; padding: 3rem 1rem; color: #888780; font-size: 14px; }

    @media (max-width: 480px) {
      .input-row { flex-wrap: wrap; }
      .input-row input { min-width: 0; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><span>✓</span> My Todo</a>
  <a class="back-link" href="index.html">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="13" y1="8" x2="3" y2="8"/><polyline points="7,4 3,8 7,12"/>
    </svg>
    홈으로
  </a>
</nav>

<div class="container">
  <p class="page-title">할 일 목록</p>
  <p class="date-str" id="date-str"></p>

  <div class="input-row">
    <input type="text" id="todo-input" placeholder="새 할 일을 입력하세요..." />
    <select id="priority-sel">
      <option value="mid">보통</option>
      <option value="high">높음</option>
      <option value="low">낮음</option>
    </select>
    <button class="add-btn" onclick="addTodo()">+ 추가</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">전체</div><div class="stat-value" id="s-total">0</div></div>
    <div class="stat"><div class="stat-label">완료</div><div class="stat-value" id="s-done">0</div></div>
    <div class="stat"><div class="stat-label">남은 일</div><div class="stat-value" id="s-left">0</div></div>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
    <button class="filter-btn" onclick="setFilter('active',this)">미완료</button>
    <button class="filter-btn" onclick="setFilter('done',this)">완료</button>
    <button class="clear-btn" onclick="clearDone()">완료 항목 삭제</button>
  </div>

  <div class="todo-list" id="todo-list"></div>
</div>

<script>
  let todos = JSON.parse(localStorage.getItem('mytodo_v1') || '[]');
  let filter = 'all';
  const labels = { high: '높음', mid: '보통', low: '낮음' };
  const days = ['일','월','화','수','목','금','토'];
  const now = new Date();
  document.getElementById('date-str').textContent =
    now.getFullYear() + '년 ' + (now.getMonth()+1) + '월 ' + now.getDate() + '일 (' + days[now.getDay()] + ')';

  document.getElementById('todo-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  function save() { localStorage.setItem('mytodo_v1', JSON.stringify(todos)); }

  function addTodo() {
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now(), text, priority: document.getElementById('priority-sel').value, done: false });
    input.value = '';
    save(); render();
  }
  function toggleTodo(id) { const t = todos.find(t=>t.id===id); if(t) t.done=!t.done; save(); render(); }
  function deleteTodo(id) { todos = todos.filter(t=>t.id!==id); save(); render(); }
  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); render();
  }
  function clearDone() { todos = todos.filter(t=>!t.done); save(); render(); }

  function render() {
    document.getElementById('s-total').textContent = todos.length;
    const done = todos.filter(t=>t.done).length;
    document.getElementById('s-done').textContent = done;
    document.getElementById('s-left').textContent = todos.length - done;
    const visible = todos.filter(t => filter==='all' ? true : filter==='done' ? t.done : !t.done);
    const list = document.getElementById('todo-list');
    if (!visible.length) { list.innerHTML = '<div class="empty">할 일이 없습니다.</div>'; return; }
    list.innerHTML = visible.map(t => `
      <div class="todo-item ${t.done?'done':''}">
        <button class="check-btn ${t.done?'checked':''}" onclick="toggleTodo(${t.id})">
          ${t.done?'<svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>':''}
        </button>
        <span class="todo-text">${t.text}</span>
        <span class="priority-badge p-${t.priority}">${labels[t.priority]}</span>
        <button class="delete-btn" onclick="deleteTodo(${t.id})">✕</button>
      </div>`).join('');
  }
  render();
</script>
</body>
</html>
