<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
      background: #ffffff;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
    }
    .logo {
      font-size: 17px;
      font-weight: 500;
      color: #1a1a18;
      text-decoration: none;
    }
    .logo span { color: #534AB7; }
    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }
    nav ul a {
      font-size: 14px;
      color: #5f5e5a;
      text-decoration: none;
    }
    nav ul a:hover { color: #1a1a18; }

    /* HERO */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 1.5rem 4rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #3C3489;
      background: #EEEDFE;
      border: 0.5px solid #AFA9EC;
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #534AB7;
    }
    h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 500;
      line-height: 1.2;
      color: #1a1a18;
      max-width: 640px;
      margin-bottom: 1.25rem;
    }
    h1 em {
      font-style: normal;
      color: #534AB7;
    }
    .subtitle {
      font-size: 17px;
      color: #5f5e5a;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      height: 44px;
      padding: 0 24px;
      background: #534AB7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #3C3489; }
    .btn-outline {
      height: 44px;
      padding: 0 24px;
      background: transparent;
      color: #1a1a18;
      border: 0.5px solid rgba(0,0,0,0.25);
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .btn-outline:hover { background: #eeede8; }

    /* FEATURES */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      max-width: 760px;
      width: 100%;
      margin: 3.5rem auto 0;
    }
    .feat-card {
      background: #ffffff;
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: left;
    }
    .feat-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #EEEDFE;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .feat-icon svg { width: 18px; height: 18px; stroke: #534AB7; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .feat-card h3 { font-size: 14px; font-weight: 500; color: #1a1a18; margin-bottom: 4px; }
    .feat-card p { font-size: 13px; color: #5f5e5a; line-height: 1.5; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 13px;
      color: #888780;
      border-top: 0.5px solid rgba(0,0,0,0.08);
    }

    @media (max-width: 480px) {
      nav ul { display: none; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="#"><span>✓</span> My Todo</a>
    <ul>
      <li><a href="#">소개</a></li>
      <li><a href="todo.html">앱 열기</a></li>
    </ul>
  </nav>

  <main class="hero">
    <div class="badge">
      <span class="badge-dot"></span>
      테스트 버전 공개 중
    </div>

    <h1>할 일을 <em>간단하게</em><br>관리하세요</h1>

    <p class="subtitle">
      복잡한 설치 없이 브라우저에서 바로 사용하는<br>
      깔끔한 할 일 관리 앱입니다.
    </p>

    <div class="btn-row">
      <a class="btn-primary" href="todo.html">
        지금 시작하기
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="8" x2="13" y2="8"/><polyline points="9,4 13,8 9,12"/>
        </svg>
      </a>
      <a class="btn-outline" href="https://github.com/lancidxai/lancidxai.github.io" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        GitHub
      </a>
    </div>

    <div class="features">
      <div class="feat-card">
        <div class="feat-icon">
          <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </div>
        <h3>우선순위 설정</h3>
        <p>높음 / 보통 / 낮음으로 중요도를 구분해요.</p>
      </div>
      <div class="feat-card">
        <div class="feat-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <h3>진행 상황 추적</h3>
        <p>전체 / 완료 / 남은 항목 수를 한눈에 확인해요.</p>
      </div>
      <div class="feat-card">
        <div class="feat-icon">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </div>
        <h3>데이터 자동 저장</h3>
        <p>브라우저에 자동 저장되어 새로고침해도 유지돼요.</p>
      </div>
    </div>
  </main>

  <footer>
    © 2025 My Todo · 테스트 중인 사이트입니다
  </footer>

</body>
</html>
